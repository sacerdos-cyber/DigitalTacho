<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">
    <meta name="apple-mobile-web-app-capable"
          content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">
    <meta name="apple-mobile-web-app-title"
          content="DigitalTacho">
    <title>DigitalTacho</title>
    <link rel="stylesheet"
          href="style.css">
</head>
<body>
<main class="tacho">
    <!-- =========================
         GESCHWINDIGKEIT
         ========================= -->
    <section class="speed-area">
        <div id="speed">
            0
        </div>
        <div class="unit">
            km/h
        </div>
    </section>
    <!-- =========================
         FAHRDATEN
         ========================= -->
    <section class="stats">
        <div class="stat">
            <div
                class="stat-value"
                id="average">
                0
            </div>
            <div class="stat-label">
                Ø km/h
            </div>
        </div>
        <div class="stat">
            <div
                class="stat-value"
                id="maximum">
                0
            </div>
            <div class="stat-label">
                MAX km/h
            </div>
        </div>
        <div class="stat">
            <div
                class="stat-value"
                id="distance">
                0.0
            </div>
            <div class="stat-label">
                km
            </div>
        </div>
        <div class="stat">
            <div
                class="stat-value"
                id="duration">
                00:00
            </div>
            <div class="stat-label">
                Fahrzeit
            </div>
        </div>
    </section>
    <!-- =========================
         RESET
         ========================= -->
    <button
        id="resetButton"
        type="button">
        RESET
    </button>
    <!-- =========================
         GPS STATUS
         ========================= -->
    <div id="status">
        GPS wird gestartet …
    </div>
</main>
<script src="app.js"></script>
</body>
</html>

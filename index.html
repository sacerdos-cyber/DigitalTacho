<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">
    <title>DigitalTacho GPS Test</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #status {
            text-align: center;
            font-size: 24px;
        }
        #speed {
            margin-top: 20px;
            font-size: 100px;
            font-weight: 300;
        }
    </style>
</head>
<body>
<div id="status">
    GPS wird gestartet …
</div>
<div id="speed">
    0 km/h
</div>
<script>
const status = document.getElementById("status");
const speed = document.getElementById("speed");
if (!navigator.geolocation) {
    status.textContent =
        "GPS wird nicht unterstützt";
} else {
    status.textContent =
        "GPS wird angefordert …";
    navigator.geolocation.watchPosition(
        function(position) {
            const gpsSpeed =
                position.coords.speed;
            if (
                gpsSpeed !== null &&
                Number.isFinite(gpsSpeed) &&
                gpsSpeed >= 0
            ) {
                const kmh =
                    Math.round(gpsSpeed * 3.6);
                speed.textContent =
                    kmh + " km/h";
            }
            status.textContent =
                "GPS aktiv · Genauigkeit ±" +
                Math.round(position.coords.accuracy) +
                " m";
        },
        function(error) {
            status.textContent =
                "GPS-Fehler " +
                error.code +
                ": " +
                error.message;
        },
        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 15000
        }
    );
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >
    <meta
        name="theme-color"
        content="#000000"
    >
    <title>DigitalTacho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="portrait-warning">
        Bitte das iPhone quer halten.
    </div>
    <main class="tacho">
        <!-- GESCHWINDIGKEIT -->
        <section class="speed-section">
            <div id="speed" class="speed">
                0
            </div>
            <div class="unit">
                km/h
            </div>
            <div id="status" class="status">
                GPS wird gestartet …
            </div>
        </section>
        <!-- FAHRTDATEN -->
        <section class="stats">
            <div class="stat">
                <span class="label">
                    Ø Geschwindigkeit
                </span>
                <span id="averageSpeed" class="value">
                    0.0 km/h
                </span>
            </div>
            <div class="stat">
                <span class="label">
                    Maximum
                </span>
                <span id="maximumSpeed" class="value">
                    0.0 km/h
                </span>
            </div>
            <div class="stat">
                <span class="label">
                    Strecke
                </span>
                <span id="distance" class="value">
                    0.00 km
                </span>
            </div>
            <div class="stat">
                <span class="label">
                    Fahrzeit
                </span>
                <span id="duration" class="value">
                    00:00:00
                </span>
            </div>
        </section>
        <!-- BEDIENUNG -->
        <section class="controls">
            <button
                id="startButton"
                type="button"
                class="start-button"
            >
                START
            </button>
            <button
                id="resetButton"
                type="button"
                class="reset-button"
            >
                RESET
            </button>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
